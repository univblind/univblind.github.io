<!doctype html>
<!-- 영수증 공유 글의 앱 받기 주소 (https://univblind.github.io/taxi). univblind.github.io 저장소의 taxi/index.html 로 올린다.
     아이폰·아이패드는 App Store, 안드로이드는 Google Play 로 바로 보내고, 그 밖(PC 등)에서는 두 버튼을 보여 준다. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxi Meter</title>
<meta name="description" content="GPS taxi fare meter with official city tariffs">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #101216; color: #e6e8ec; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px 16px; max-width: 420px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 26px; margin: 16px 0 6px; }
  p { color: #9aa0ab; margin: 0 0 24px; line-height: 1.5; }
  a.btn { display: block; margin: 10px 0; padding: 14px; border-radius: 12px; text-decoration: none;
          font-weight: 700; font-size: 17px; background: #ffb000; color: #111; }
  a.btn.alt { background: #1a1d23; color: #e6e8ec; border: 1px solid #2b2f37; }
</style>
<script>
  (function () {
    var ios = 'https://apps.apple.com/app/id6838145415';
    var android = 'https://play.google.com/store/apps/details?id=com.worldtaximeter.app';
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) location.replace(ios);
    else if (/Android/.test(ua)) location.replace(android);
  })();
</script>
</head>
<body>
<main>
  <img src="icon.png" alt="" onerror="this.style.display='none'">
  <h1>Taxi Meter</h1>
  <p>GPS taxi fare meter with official city tariffs.<br>택시 미터기 · 공식 택시요금으로 실시간 계산</p>
  <a class="btn" href="https://apps.apple.com/app/id6838145415">App Store</a>
  <a class="btn alt" href="https://play.google.com/store/apps/details?id=com.worldtaximeter.app">Google Play</a>
</main>
</body>
</html>
